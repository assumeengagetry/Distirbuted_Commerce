apiVersion: v1
kind: ConfigMap
metadata:
  name: commerce-worker
  namespace: commerce
data:
  SERVICE_NAME: job-worker
  DB_MAX_CONNS: "5"
  DB_MIN_IDLE_CONNS: "1"
  METRICS_ADDR: 127.0.0.1:9104
  QUEUE_REDIS_ADDR: redis-queue.example.invalid:6380
  QUEUE_REDIS_USERNAME: commerce
  QUEUE_REDIS_DB: "0"
  QUEUE_REDIS_TLS_CA_FILE: /var/run/secrets/redis/ca.crt
  QUEUE_REDIS_TLS_SERVER_NAME: redis-queue.example.invalid
  JOB_QUEUE: maintenance
  JOB_TASK_TIMEOUT: 10s
  JOB_WORKER_CONCURRENCY: "4"
  JOB_WORKER_SHUTDOWN_TIMEOUT: 15s
  JOB_CLEANUP_INTERVAL: 1m
  SESSION_CLEANUP_BATCH_SIZE: "100"
