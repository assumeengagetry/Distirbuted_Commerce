apiVersion: apps/v1
kind: Deployment
metadata:
  name: commerce-worker
  namespace: commerce
  labels:
    app.kubernetes.io/name: distributed-commerce
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: distributed-commerce
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: distributed-commerce
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: commerce-worker
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: job-worker
          image: distributed-commerce/job-worker:phase8
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: commerce-common
            - configMapRef:
                name: commerce-worker
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: commerce-runtime
                  key: database-url-worker
            - name: QUEUE_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: commerce-runtime
                  key: queue-redis-password
            - name: GOMEMLIMIT
              value: 192MiB
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            exec:
              command: ["/app/loopback-probe", "127.0.0.1:9104"]
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["/app/loopback-probe", "127.0.0.1:9104"]
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            exec:
              command: ["/app/loopback-probe", "127.0.0.1:9104"]
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: postgres-ca
              mountPath: /var/run/secrets/postgres
              readOnly: true
            - name: redis-ca
              mountPath: /var/run/secrets/redis
              readOnly: true
      volumes:
        - name: postgres-ca
          secret:
            secretName: commerce-postgres-ca
            defaultMode: 288
        - name: redis-ca
          secret:
            secretName: commerce-queue-redis-ca
            defaultMode: 288
