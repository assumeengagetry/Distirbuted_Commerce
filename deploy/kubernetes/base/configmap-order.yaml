apiVersion: v1
kind: ConfigMap
metadata:
  name: commerce-order
  namespace: commerce
data:
  SERVICE_NAME: order-service
  HTTP_ADDR: 0.0.0.0:8082
  HTTP_TLS_CERT_FILE: /var/run/secrets/http/tls.crt
  HTTP_TLS_KEY_FILE: /var/run/secrets/http/tls.key
  IDENTITY_GRPC_TARGET: commerce-user.commerce.svc.cluster.local:9091
  GRPC_CALL_TIMEOUT: 1s
  GRPC_TLS_CERT_FILE: /var/run/secrets/grpc/tls.crt
  GRPC_TLS_KEY_FILE: /var/run/secrets/grpc/tls.key
  GRPC_TLS_CA_FILE: /var/run/secrets/identity-ca/ca.crt
  GRPC_TLS_SERVER_NAME: commerce-user.commerce.svc.cluster.local
  METRICS_ADDR: 127.0.0.1:9102
  COMMERCE_RATE_LIMIT_RPS: "20"
  COMMERCE_RATE_LIMIT_BURST: "40"
  COMMERCE_RATE_LIMIT_ENTRY_TTL: 10m
  COMMERCE_RATE_LIMIT_MAX_ENTRIES: "10000"
