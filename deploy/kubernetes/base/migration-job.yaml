apiVersion: batch/v1
kind: Job
metadata:
  name: commerce-migrate
  namespace: commerce
  labels:
    app.kubernetes.io/name: distributed-commerce
    app.kubernetes.io/component: migrator
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: distributed-commerce
        app.kubernetes.io/component: migrator
    spec:
      restartPolicy: Never
      serviceAccountName: commerce-migrator
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrator
          image: distributed-commerce/migrator:phase8
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: commerce-runtime
                  key: database-url-migrator
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: postgres-ca
              mountPath: /var/run/secrets/postgres
              readOnly: true
      volumes:
        - name: postgres-ca
          secret:
            secretName: commerce-postgres-ca
            defaultMode: 288
