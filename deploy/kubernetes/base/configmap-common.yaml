apiVersion: v1
kind: ConfigMap
metadata:
  name: commerce-common
  namespace: commerce
data:
  APP_ENV: production
  LOG_LEVEL: info
  HTTP_READ_HEADER_TIMEOUT: 5s
  HTTP_READ_TIMEOUT: 10s
  HTTP_WRITE_TIMEOUT: 20s
  HTTP_IDLE_TIMEOUT: 60s
  HTTP_SHUTDOWN_TIMEOUT: 20s
  DB_MAX_CONNS: "10"
  DB_MIN_IDLE_CONNS: "2"
  DB_MAX_CONN_LIFETIME: 1h
  DB_MAX_CONN_LIFETIME_JITTER: 5m
  DB_MAX_CONN_IDLE_TIME: 30m
  DB_HEALTH_CHECK_PERIOD: 1m
  DB_PING_TIMEOUT: 2s
  DB_OPERATION_TIMEOUT: 5s
  DB_LOCK_TIMEOUT: 2s
  DB_COMMIT_RESOLUTION_TIMEOUT: 2s
  METRICS_READ_HEADER_TIMEOUT: 2s
  METRICS_GATHER_TIMEOUT: 3s
  METRICS_WRITE_TIMEOUT: 5s
  METRICS_IDLE_TIMEOUT: 30s
  METRICS_SHUTDOWN_TIMEOUT: 10s
  OTEL_TRACES_EXPORTER: none
  TELEMETRY_SHUTDOWN_TIMEOUT: 12s
